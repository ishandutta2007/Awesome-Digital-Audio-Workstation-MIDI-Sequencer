<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0d1127" />
      <stop offset="100%" stop-color="#05070f" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="pianoKeyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Filters & Glows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8b5cf6" flood-opacity="0.25" />
    </filter>

    <style>
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
        50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.6; }
      }
      @keyframes eqBar1 {
        0%, 100% { height: 25px; y: 345px; }
        50% { height: 75px; y: 295px; }
      }
      @keyframes eqBar2 {
        0%, 100% { height: 60px; y: 310px; }
        50% { height: 30px; y: 340px; }
      }
      @keyframes eqBar3 {
        0%, 100% { height: 40px; y: 330px; }
        50% { height: 85px; y: 285px; }
      }
      @keyframes eqBar4 {
        0%, 100% { height: 70px; y: 300px; }
        50% { height: 20px; y: 350px; }
      }
      @keyframes sweepScan {
        0% { transform: translateX(-150px); opacity: 0; }
        50% { opacity: 0.6; }
        100% { transform: translateX(1250px); opacity: 0; }
      }
      @keyframes waveFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 250px 120px; }
      .orb-2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 950px 280px; }
      .bar-1 { animation: eqBar1 1.2s ease-in-out infinite; }
      .bar-2 { animation: eqBar2 0.9s ease-in-out infinite; }
      .bar-3 { animation: eqBar3 1.5s ease-in-out infinite; }
      .bar-4 { animation: eqBar4 1.1s ease-in-out infinite; }
      .scanner-beam { animation: sweepScan 6s linear infinite; }
      .wave-motion { animation: waveFloat 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Orbs (Deep Background) -->
  <circle class="orb-1" cx="250" cy="110" r="140" fill="#8b5cf6" filter="url(#glow)" />
  <circle class="orb-2" cx="960" cy="280" r="160" fill="#ec4899" filter="url(#glow)" />
  <circle cx="620" cy="80" r="100" fill="#06b6d4" opacity="0.25" filter="url(#glow)" />

  <!-- Grid Blueprint Pattern (Behind Content) -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M0,70 H1200 M0,140 H1200 M0,210 H1200 M0,280 H1200 M0,350 H1200" />
    <path d="M100,0 V420 M200,0 V420 M300,0 V420 M400,0 V420 M500,0 V420 M600,0 V420 M700,0 V420 M800,0 V420 M900,0 V420 M1000,0 V420 M1100,0 V420" />
  </g>

  <!-- Decorative MIDI Piano Roll / Step Sequencer Track (Bottom-Left Background) -->
  <g opacity="0.4" transform="translate(40, 290)">
    <!-- MIDI Blocks -->
    <rect x="10" y="20" width="45" height="12" rx="3" fill="#ec4899" />
    <rect x="60" y="38" width="60" height="12" rx="3" fill="#8b5cf6" />
    <rect x="125" y="8" width="50" height="12" rx="3" fill="#06b6d4" />
    <rect x="180" y="24" width="70" height="12" rx="3" fill="#3b82f6" />
    <rect x="255" y="44" width="45" height="12" rx="3" fill="#10b981" />
    <rect x="305" y="14" width="60" height="12" rx="3" fill="#ec4899" />
    <rect x="370" y="30" width="50" height="12" rx="3" fill="#8b5cf6" />
  </g>

  <!-- Realtime Dynamic Graphic Equalizer Bars (Bottom-Right Background) -->
  <g transform="translate(760, 0)" opacity="0.75">
    <rect class="bar-1" x="0" y="320" width="10" height="50" rx="4" fill="url(#waveGrad1)" />
    <rect class="bar-2" x="16" y="310" width="10" height="60" rx="4" fill="url(#waveGrad1)" />
    <rect class="bar-3" x="32" y="330" width="10" height="40" rx="4" fill="url(#waveGrad1)" />
    <rect class="bar-4" x="48" y="300" width="10" height="70" rx="4" fill="url(#accentGrad)" />
    <rect class="bar-2" x="64" y="340" width="10" height="30" rx="4" fill="url(#accentGrad)" />
    <rect class="bar-1" x="80" y="305" width="10" height="65" rx="4" fill="url(#waveGrad2)" />
    <rect class="bar-4" x="96" y="325" width="10" height="45" rx="4" fill="url(#waveGrad2)" />
    <rect class="bar-3" x="112" y="295" width="10" height="75" rx="4" fill="url(#waveGrad2)" />
    <rect class="bar-2" x="128" y="335" width="10" height="35" rx="4" fill="url(#waveGrad1)" />
    <rect class="bar-1" x="144" y="315" width="10" height="55" rx="4" fill="url(#waveGrad1)" />
    <rect class="bar-4" x="160" y="290" width="10" height="80" rx="4" fill="url(#accentGrad)" />
    <rect class="bar-3" x="176" y="330" width="10" height="40" rx="4" fill="url(#accentGrad)" />
    <rect class="bar-2" x="192" y="305" width="10" height="65" rx="4" fill="url(#waveGrad2)" />
    <rect class="bar-1" x="208" y="325" width="10" height="45" rx="4" fill="url(#waveGrad2)" />
    <rect class="bar-4" x="224" y="285" width="10" height="85" rx="4" fill="url(#waveGrad2)" />
    <rect class="bar-3" x="240" y="315" width="10" height="55" rx="4" fill="url(#waveGrad1)" />
    <rect class="bar-2" x="256" y="340" width="10" height="30" rx="4" fill="url(#waveGrad1)" />
    <rect class="bar-1" x="272" y="310" width="10" height="60" rx="4" fill="url(#accentGrad)" />
    <rect class="bar-4" x="288" y="330" width="10" height="40" rx="4" fill="url(#waveGrad2)" />
    <rect class="bar-2" x="304" y="295" width="10" height="75" rx="4" fill="url(#waveGrad2)" />
    <rect class="bar-3" x="320" y="325" width="10" height="45" rx="4" fill="url(#waveGrad1)" />
    <rect class="bar-1" x="336" y="345" width="10" height="25" rx="4" fill="url(#waveGrad1)" />
    <rect class="bar-4" x="352" y="315" width="10" height="55" rx="4" fill="url(#accentGrad)" />
    <rect class="bar-2" x="368" y="335" width="10" height="35" rx="4" fill="url(#waveGrad2)" />
    <rect class="bar-3" x="384" y="305" width="10" height="65" rx="4" fill="url(#waveGrad2)" />
  </g>

  <!-- Audio Waveform Line (Slight float animation) -->
  <path class="wave-motion" d="M 50 380 Q 200 340 350 380 T 650 370 T 950 380 T 1150 365" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" opacity="0.65" />

  <!-- Scanning Light Line across the top of timeline -->
  <rect class="scanner-beam" y="0" width="180" height="420" fill="url(#accentGrad)" opacity="0.08" />

  <!-- ================= FOREGROUND CONTENT (CRYSTAL CLEAR & UNHIDDEN) ================= -->

  <!-- Top Badges / Pill Tags -->
  <g transform="translate(70, 48)">
    <rect x="0" y="0" width="168" height="28" rx="14" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1.2" />
    <text x="84" y="18" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">🎹 DIGITAL AUDIO</text>

    <rect x="180" y="0" width="170" height="28" rx="14" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899" stroke-width="1.2" />
    <text x="265" y="18" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">🎚️ MIDI SEQUENCER</text>

    <rect x="362" y="0" width="160" height="28" rx="14" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1.2" />
    <text x="442" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">🌐 CLOUD &amp; OPEN-SOURCE</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(70, 145)">
    <text fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.8">
      Awesome DAW &amp; MIDI Sequencer
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(70, 195)">
    <text fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500">
      Curated Landscape of SaaS Music Studios, Audio Workstations &amp; Open-Source Projects
    </text>
  </g>

  <!-- Tagline Features -->
  <g transform="translate(70, 240)">
    <text fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400">
      ✨ Multi-Track Audio Recording • VST3 / LV2 / CLAP Plugins • Piano-Roll &amp; Tracker Sequencing • Live Modular Patching
    </text>
  </g>

  <!-- Outer Border Frame with subtle neon outline -->
  <rect x="1" y="1" width="1198" height="418" rx="19" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.4" />
</svg>
